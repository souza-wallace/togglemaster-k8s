# Cria o Secret auth-service-secrets (o mesmo nome que o deployment.yaml usa em envFrom)
# a partir do Secrets Manager. Aqui fica só a referência; o valor nunca passa pelo Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-secrets
  namespace: auth-service
  labels:
    app: auth-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: auth-service-secrets
    creationPolicy: Owner
    template:
      data:
        # urlquery escapa caracteres especiais da senha gerada pelo RDS dentro da URL.
        DATABASE_URL: "postgres://{{ .username }}:{{ .password | urlquery }}@togglemaster-auth.ced8skq0071m.us-east-1.rds.amazonaws.com:5432/auth_db?sslmode=require"
        MASTER_KEY: "{{ .master_key }}"
  data:
    # Segredo criado pelo RDS. ARN: terraform output rds_auth_secret_arn
    - secretKey: username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:980228515477:secret:rds!db-a8fd3cc1-b427-430a-9fd0-e8df19c701c6-vtDfUY
        property: username
    - secretKey: password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:980228515477:secret:rds!db-a8fd3cc1-b427-430a-9fd0-e8df19c701c6-vtDfUY
        property: password
    # Segredo criado pelo Terraform (secrets.tf), valor gravado pela CLI.
    - secretKey: master_key
      remoteRef:
        key: togglemaster/auth/master-key
