# Cria o Secret targeting-service-secrets (o mesmo nome que o deployment.yaml usa em envFrom)
# a partir do Secrets Manager. Aqui fica só a referência; o valor nunca passa pelo Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: targeting-service-secrets
  namespace: targeting-service
  labels:
    app: targeting-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: targeting-service-secrets
    creationPolicy: Owner
    template:
      data:
        # urlquery escapa caracteres especiais da senha gerada pelo RDS dentro da URL.
        DATABASE_URL: "postgres://{{ .username }}:{{ .password | urlquery }}@togglemaster-targeting.ced8skq0071m.us-east-1.rds.amazonaws.com:5432/targeting_db?sslmode=require"
  data:
    # Segredo criado pelo RDS. ARN: terraform output rds_targeting_secret_arn
    - secretKey: username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:980228515477:secret:rds!db-6d2c1602-5548-425f-a3c6-0e1ca87d7814-4tF4Dt
        property: username
    - secretKey: password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:980228515477:secret:rds!db-6d2c1602-5548-425f-a3c6-0e1ca87d7814-4tF4Dt
        property: password
