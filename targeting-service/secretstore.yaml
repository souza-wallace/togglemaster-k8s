# Onde buscar os segredos: AWS Secrets Manager, em us-east-1.
# Sem bloco auth: o External Secrets usa a role IRSA do próprio pod
# (togglemaster-external-secrets-role, criada no Terraform).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: targeting-service
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
