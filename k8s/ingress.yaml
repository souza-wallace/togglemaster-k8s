# Ingress por namespace (backend no mesmo namespace do Service).
# Requer Ingress NGINX Controller no cluster.
# Paths externos são reescritos para as rotas reais da app (/health, /flags, /evaluate, ...).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-service
  namespace: auth-service
  labels:
    app: auth-service
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
