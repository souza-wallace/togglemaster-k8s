# Helm values — ingress-nginx no EKS
controller:
  replicaCount: 1
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
  serviceAccount:
    create: true
    name: ingress-nginx
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::980228515477:role/togglemaster-lab-ingress-nginx"
