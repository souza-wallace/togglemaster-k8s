# Cria o Secret flag-service-secrets (o mesmo nome que o deployment.yaml usa em envFrom)
# a partir do Secrets Manager. Aqui fica só a referência; o valor nunca passa pelo Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flag-service-secrets
  namespace: flag-service
  labels:
    app: flag-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: flag-service-secrets
    creationPolicy: Owner
    template:
      data:
        # urlquery escapa caracteres especiais da senha gerada pelo RDS dentro da URL.
        DATABASE_URL: "postgres://{{ .username }}:{{ .password | urlquery }}@togglemaster-flag.ced8skq0071m.us-east-1.rds.amazonaws.com:5432/flags_db?sslmode=require"
  data:
    # Segredo criado pelo RDS. ARN: terraform output rds_flag_secret_arn
    - secretKey: username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:980228515477:secret:rds!db-a97bba2a-731f-46dd-a363-3298b5d392c8-KqhkgM
        property: username
    - secretKey: password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:980228515477:secret:rds!db-a97bba2a-731f-46dd-a363-3298b5d392c8-KqhkgM
        property: password
