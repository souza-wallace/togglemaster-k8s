# Cria o Secret evaluation-service-secrets (o mesmo nome que o deployment.yaml usa em envFrom)
# a partir do Secrets Manager. Aqui fica só a referência; o valor nunca passa pelo Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: evaluation-service-secrets
  namespace: evaluation-service
  labels:
    app: evaluation-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: evaluation-service-secrets
    creationPolicy: Owner
  data:
    # Segredo criado pelo Terraform (secrets.tf). O valor é a chave tm_key_...
    # gerada pelo auth-service em POST /admin/keys.
    - secretKey: SERVICE_API_KEY
      remoteRef:
        key: togglemaster/evaluation/service-api-key
